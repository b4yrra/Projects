<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Slide</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="container-bg">
        <div class="slider-container">
          <div class="slide">
            <img class="slide-img" src="./img/img1.jpg" alt="" />
          </div>
          <div class="slide">
            <img class="slide-img" src="./img/img2.jpeg" alt="" />
          </div>
          <div class="slide">
            <img class="slide-img" src="./img/img3.webp" alt="" />
          </div>
          <div class="slide">
            <img class="slide-img" src="./img/img4.jpg" alt="" />
          </div>
        </div>
      </div>
      <div class="btn-section">
        <button class="design-btn" id="prev-btn">Prev</button>
        <button class="design-btn" id="next-btn">Next</button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
