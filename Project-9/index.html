<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabs that display different content</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="header">
      <h1>About</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Doloribus, ab
        rerum totam nobis, repudiandae eos eum adipisci voluptatum harum,
        impedit vel sequi cupiditate. Adipisci, eligendi molestiae esse impedit
        eum quas!
      </p>
    </div>
    <div class="home">
      <div class="img">
        <img
          class="img-size"
          src="https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=3270&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt=""
        />
      </div>
      <div class="about">
        <div class="about-btn">
          <button class="cus-btn" id="hisBtn">History</button>
          <button class="cus-btn" id="visBtn">Vision</button>
          <button class="cus-btn" id="goBtn">Goals</button>
        </div>
        <div class="about-text">
          <div class="titles"></div>
          <div class="texts"></div>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
